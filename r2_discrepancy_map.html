<style>
:root {
  --surface-1: #fcfcfb;
  --surface-2: #f5f4f2;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #8a8985;
  --border: #e0dfdb;
  --blue-700: #0d366b;
  --blue-500: #256abf;
  --blue-400: #3987e5;
  --blue-200: #9ec5f4;
  --blue-100: #cde2fb;
  --mid: #d8d7d3;
  --red-100: #fcd5d5;
  --red-200: #f5a8a8;
  --red-400: #e34948;
  --red-500: #c03030;
  --red-700: #7a1c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-1: #1a1a19;
    --surface-2: #242423;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8a8985;
    --border: #3a3a38;
    --blue-700: #cde2fb;
    --blue-500: #3987e5;
    --blue-400: #2a78d6;
    --blue-200: #184f95;
    --blue-100: #0d366b;
    --mid: #383835;
    --red-100: #5a1e1e;
    --red-200: #8b2e2e;
    --red-400: #e66767;
    --red-500: #e34948;
    --red-700: #fcd5d5;
  }
}
:root[data-theme="dark"] {
  --surface-1: #1a1a19;
  --surface-2: #242423;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8a8985;
  --border: #3a3a38;
  --blue-700: #cde2fb;
  --blue-500: #3987e5;
  --blue-400: #2a78d6;
  --blue-200: #184f95;
  --blue-100: #0d366b;
  --mid: #383835;
  --red-100: #5a1e1e;
  --red-200: #8b2e2e;
  --red-400: #e66767;
  --red-500: #e34948;
  --red-700: #fcd5d5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--surface-1);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
}
.header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 2px;
}
.header p {
  color: var(--text-secondary);
  font-size: 13px;
}
#map {
  width: 100%;
  height: calc(100vh - 80px);
  min-height: 400px;
}
.legend {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.4;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
.legend-title {
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-primary);
}
.legend-bar {
  width: 200px;
  height: 14px;
  border-radius: 3px;
  margin-bottom: 4px;
  border: 1px solid var(--border);
}
.legend-labels {
  display: flex;
  justify-content: space-between;
  color: var(--text-secondary);
  font-size: 11px;
  width: 200px;
}
.legend-labels span { white-space: nowrap; }
.legend-note {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 6px;
}
.stats-bar {
  display: flex;
  gap: 20px;
  padding: 8px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.stats-bar strong { color: var(--text-primary); font-weight: 600; }
.info-tooltip {
  font-size: 13px;
  line-height: 1.5;
  max-width: 260px;
}
.info-tooltip .tt-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.info-tooltip .tt-label { color: var(--text-muted); }
.info-tooltip .tt-val { font-weight: 600; font-variant-numeric: tabular-nums; }
.info-tooltip .tt-title {
  font-weight: 600;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
</style>

<script>
(function(){

// — color scale: diverging blue ↔ gray ↔ red —
// Clamped to ±0.15 for visual detail (P5≈-0.03, P95≈0.09)
const CLAMP = 0.15;

function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbToHex(r,g,b){
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function lerp3(a,b,t){
  return [
    Math.round(a[0]+(b[0]-a[0])*t),
    Math.round(a[1]+(b[1]-a[1])*t),
    Math.round(a[2]+(b[2]-a[2])*t)
  ];
}

// Light mode diverging ramp (5 stops per arm)
const BLUE_STOPS = ['#cde2fb','#9ec5f4','#3987e5','#256abf','#0d366b'].map(hexToRgb);
const RED_STOPS  = ['#fcd5d5','#f5a8a8','#e34948','#c03030','#7a1c1c'].map(hexToRgb);
const MID_RGB = hexToRgb('#d8d7d3');

function divergingColor(val){
  const v = Math.max(-CLAMP, Math.min(CLAMP, val));
  const t = Math.abs(v) / CLAMP; // 0..1
  const stops = v < 0 ? BLUE_STOPS : RED_STOPS;
  if(t < 0.01) return rgbToHex(...MID_RGB);
  // map t 0→1 across 5 stops (indices 0..4)
  const pos = t * (stops.length - 1);
  const i = Math.min(Math.floor(pos), stops.length - 2);
  const frac = pos - i;
  // blend from midpoint toward the arm
  if(t < 0.15){
    const rgb = lerp3(MID_RGB, stops[0], t / 0.15);
    return rgbToHex(...rgb);
  }
  const armT = (t - 0.15) / 0.85;
  const armPos = armT * (stops.length - 1);
  const ai = Math.min(Math.floor(armPos), stops.length - 2);
  const af = armPos - ai;
  const rgb = lerp3(stops[ai], stops[ai+1], af);
  return rgbToHex(...rgb);
}

// — stats —
let nPts = 0, nFes = 0, nGot = 0, nEq = 0;
let sumDiff = 0, cnt = 0;
if(typeof D !== 'undefined'){
  nPts = D.length;
  D.forEach(function(r){
    if(r[2] > 0) nFes++;
    else if(r[2] < 0) nGot++;
    else nEq++;
    if(isFinite(r[2])){ sumDiff += r[2]; cnt++; }
  });
}

document.getElementById('stats').innerHTML =
  '<span><strong>' + nPts.toLocaleString() + '</strong> grid cells</span>' +
  '<span>FES wins: <strong>' + (nFes/nPts*100).toFixed(1) + '%</strong></span>' +
  '<span>GOT wins: <strong>' + (nGot/nPts*100).toFixed(1) + '%</strong></span>' +
  '<span>Mean Δ: <strong>' + (cnt ? (sumDiff/cnt).toFixed(4) : '—') + '</strong></span>';

// — map —
var map = L.map('map',{
  center: [0, 30],
  zoom: 3,
  preferCanvas: true,
  worldCopyJump: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{
  attribution: '© <a href="https://carto.com/">CARTO</a> · © <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 12
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{
  maxZoom: 12, pane: 'overlayPane'
}).addTo(map);

// — data points —
if(typeof D !== 'undefined'){
  D.forEach(function(r){
    var lat=r[0], lon=r[1], diff=r[2], fes=r[3], got=r[4], n=r[5];
    var c = divergingColor(diff);
    var circle = L.circleMarker([lat, lon], {
      radius: 5,
      fillColor: c,
      fillOpacity: 0.85,
      color: c,
      weight: 0.5,
      opacity: 0.9
    }).addTo(map);
    var sign = diff >= 0 ? '+' : '';
    circle.bindTooltip(
      '<div class="info-tooltip">' +
      '<div class="tt-title">' + lat.toFixed(2) + '°, ' + lon.toFixed(2) + '°</div>' +
      '<div class="tt-row"><span class="tt-label">R² FES</span><span class="tt-val">' + fes.toFixed(4) + '</span></div>' +
      '<div class="tt-row"><span class="tt-label">R² GOT</span><span class="tt-val">' + got.toFixed(4) + '</span></div>' +
      '<div class="tt-row"><span class="tt-label">Δ (FES−GOT)</span><span class="tt-val">' + sign + diff.toFixed(4) + '</span></div>' +
      '<div class="tt-row"><span class="tt-label">Points</span><span class="tt-val">' + n + '</span></div>' +
      '</div>',
      {sticky: true, direction: 'top', offset: [0, -8]}
    );
  });
}

// — legend —
var legend = L.control({position: 'bottomright'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div','legend');
  // build gradient bar
  var stops = [];
  for(var i = 0; i <= 20; i++){
    var v = -CLAMP + (2*CLAMP) * i / 20;
    stops.push(divergingColor(v) + ' ' + (i/20*100) + '%');
  }
  div.innerHTML =
    '<div class="legend-title">R² Discrepancy (FES − GOT)</div>' +
    '<div class="legend-bar" style="background:linear-gradient(to right,' + stops.join(',') + ')"></div>' +
    '<div class="legend-labels">' +
      '<span>−' + CLAMP + '</span>' +
      '<span>0</span>' +
      '<span>+' + CLAMP + '</span>' +
    '</div>' +
    '<div class="legend-labels" style="margin-top:1px">' +
      '<span>← GOT better</span>' +
      '<span>FES better →</span>' +
    '</div>' +
    '<div class="legend-note">Clamped at ±' + CLAMP + '; 0.25° grid means</div>';
  return div;
};
legend.addTo(map);

})();
</script>
