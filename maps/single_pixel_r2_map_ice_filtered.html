<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Single Pixel FES vs GOT R² (Ice-Filtered)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="leaflet.min.css">
<link rel="stylesheet" href="map.css">
</head>

<body>
<div class="head">
  <h1>Single Pixel: FES vs GOT R² Discrepancy (Ice-Filtered)</h1>
  <p>864,752 SWOT coastline points (single pixel, ice-filtered: all cycles must have dynamic_ice_flag = 0) showing R² discrepancy between FES and GOT ocean-tide corrections. 55°S–65°N, within 10 km of land.</p>
</div>
<div class="stats" id="stats"></div>
<div class="controls">
  <div class="ctl">
    <span class="lab">Better model</span>
    <div class="seg" role="radiogroup" aria-label="Filter by which model fits better">
      <label><input type="radio" name="dir" id="dir-all" value="all" checked><span class="txt">Both</span></label>
      <label><span class="dot" id="dot-fes"></span><input type="radio" name="dir" id="dir-fes" value="fes"><span class="txt">FES</span></label>
      <label><span class="dot" id="dot-got"></span><input type="radio" name="dir" id="dir-got" value="got"><span class="txt">GOT</span></label>
    </div>
  </div>
  <div class="ctl">
    <label class="lab" for="thresh">|Δ| at least</label>
    <input type="range" id="thresh" min="0" max="0.94" step="0.01" value="0">
    <span class="thresh-val" id="thresh-val">0.00</span>
  </div>
  <div class="ctl">
    <span class="shown" id="shown"></span>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</div>
<div id="map"></div>

<!-- Leaflet, basemap geometry, the point payload, then the map logic. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="basemap_geo.js"></script>
<script src="d1_ice.js"></script>
<script src="d2_ice.js"></script>
<script src="d3_ice.js"></script>
<script src="map_common.js"></script>
<script src="discrepancy_map.js"></script>
<script src="single_pixel_r2_map_ice_filtered.js"></script>
</body>
</html>
